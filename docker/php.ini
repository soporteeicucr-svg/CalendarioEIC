; Ajustes requeridos por el codigo de registro/, probados en el entorno de
; desarrollo local antes de llevarlos a produccion.

; Varias paginas (estudiante/formulario-registro.php, docente/inicio.php,
; administrativo/inicio.php, etc.) emiten HTML antes de session_start().
; XAMPP trae el buffer de salida activado por defecto; esta imagen no, asi
; que hay que fijarlo o esas paginas quedan en blanco.
output_buffering = 4096

date.timezone = America/Costa_Rica

; Produccion: no mostrar errores al usuario, pero si dejarlos en el log del
; contenedor (visibles con `docker logs`).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
expose_php = Off
