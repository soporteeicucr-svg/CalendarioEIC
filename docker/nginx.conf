# El TLS lo termina el Apache reverse proxy de la VM (163.178.171.9);
# a este contenedor solo llega HTTP plano por loopback. Se lee el header
# X-Forwarded-Proto que debe enviar ese proxy para que la app
# (registro/index.php) genere enlaces https:// solo cuando en verdad se
# accedió por HTTPS del lado del usuario final. Sin ese header (ej.
# pruebas locales directas sin proxy) se asume HTTP normal.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https   "on";
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php inicio.php;

    # nginx no sabe en que puerto externo lo expone Docker (siempre
    # escucha 80 adentro del contenedor). Sin esto, sus redirects
    # automaticos (ej. "/docente" -> "/docente/") arman una URL absoluta
    # con ese puerto interno y el navegador termina en el puerto
    # equivocado. Con esto, esos redirects quedan relativos ("/docente/"),
    # y el navegador los resuelve con el host:puerto que ya esta usando.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        # El fastcgi_params de este paquete de nginx usa $host (sin puerto)
        # por seguridad ante Host headers falsificados. Aqui no aplica: la
        # app siempre esta detras del Apache reverse proxy (produccion) o
        # se prueba en forma directa (local), asi que se restaura el puerto.
        fastcgi_param HTTP_HOST $http_host;
    }

    # Defensa en profundidad: nada de dumps de BD, dotfiles, ni backups
    # directamente servibles, aunque hayan quedado dentro del docroot.
    location ~ \.(sql|md|log|bak)$ {
        deny all;
    }
    location ~ /\. {
        deny all;
    }

    client_max_body_size 20m;
}
